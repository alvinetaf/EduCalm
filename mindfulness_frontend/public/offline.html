<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduCalm — Hors ligne</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; flex-direction:column;
           align-items:center; justify-content:center; background:#FFFBEB;
           font-family:system-ui,sans-serif; color:#14532D; text-align:center; padding:24px; }
    .icon { font-size:64px; margin-bottom:24px; }
    h1 { font-size:28px; font-weight:700; margin-bottom:12px; }
    p { font-size:16px; color:#6B7280; max-width:320px; line-height:1.6; }
    .tip { margin-top:32px; background:#D1FAE5; border-radius:16px;
           padding:16px 24px; font-size:14px; color:#14532D; max-width:320px; }
  </style>
</head>
<body>
  <div class="icon">📵</div>
  <h1>Tu es hors ligne</h1>
  <p>Reconnecte-toi pour accéder à EduCalm, ou utilise les séances déjà enregistrées.</p>
  <div class="tip">
    💡 <strong>Astuce :</strong> Clique sur "Enregistrer" sur chaque séance
    pour l'utiliser sans connexion.
  </div>
</body>
</html>
